	<script>
var VX_EQ_GAINS=[3,5,3,1,2,3,2,3,4,2];
var VX_VOL=1.15;
(function(){
  var FREQ=[31,63,125,250,500,1000,2000,4000,8000,16000];
  var OAC=window.AudioContext||window.webkitAudioContext;
  var ctxs=[];
  function PAC(o){
    var ctx=o?new OAC(o):new OAC();
    var mg=ctx.createGain();mg.gain.value=VX_VOL;
    var fl=FREQ.map(function(f,i){
      var n=ctx.createBiquadFilter();n.type="peaking";
      n.frequency.value=f;n.Q.value=1.4;n.gain.value=VX_EQ_GAINS[i]||0;return n;
    });
    for(var i=0;i<fl.length-1;i++)fl[i].connect(fl[i+1]);
    fl[fl.length-1].connect(mg);mg.connect(ctx.destination);
    Object.defineProperty(ctx,"destination",{get:function(){return fl[0];}});
    ctxs.push(ctx);window.__vxCtx=ctxs;return ctx;
  }
  PAC.prototype=OAC.prototype;
  window.AudioContext=PAC;
  if(window.webkitAudioContext)window.webkitAudioContext=PAC;
})();
	</script>

	<script>(function () {

    // Hardcoded color value for the pure white glow effect
    var whiteColor = '#00ff00';

    function buildGlow(c) {
        return '0 0 4px '+c+',0 0 10px '+c+',0 0 20px '+c+',0 0 6px '+c+',0 0 14px '+c+',0 0 28px '+c;
    }

    var originalTitle   = document.title;
    var origFaviconEl   = document.querySelector("link[rel~='icon']");
    var origFaviconHref = origFaviconEl ? origFaviconEl.href : null;
    var favicon         = origFaviconEl;
    if (!favicon) { favicon = document.createElement('link'); favicon.rel = 'icon'; document.head.appendChild(favicon); }

    var blocked     = false;
    var overlay     = null;
    var textEl      = null;
    var lastState   = null;

    // Strict input event blocking to prevent clicking, scrolling, or typing anywhere
    function blockInput(e) { e.stopImmediatePropagation(); e.preventDefault(); }
    function addBlockers() {
        if (blocked) return; blocked = true;
        ['keydown','keyup','keypress','mousedown','mouseup','mousemove','click','touchstart','wheel'].forEach(function(ev) {
            document.addEventListener(ev, blockInput, true);
        });
    }
    function removeBlockers() {
        if (!blocked) return; blocked = false;
        ['keydown','keyup','keypress','mousedown','mouseup','mousemove','click','touchstart','wheel'].forEach(function(ev) {
            document.removeEventListener(ev, blockInput, true);
        });
    }

    function buildOverlay() {
        if (overlay) return;
        overlay = document.createElement('div');
        overlay.id = '__vxAccessOverlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;align-items:center;justify-content:center;z-index:2147483647;visibility:visible';
        
        textEl = document.createElement('div');
        textEl.textContent = 'Access Denied';
        textEl.style.cssText = 'color:'+whiteColor+';font-size:48px;font-weight:bold;font-family:VT323;text-shadow:'+buildGlow(whiteColor)+';user-select:none;pointer-events:none';
        
        overlay.appendChild(textEl);
        document.body.appendChild(overlay);
        if (lastState === 'Denied') overlay.style.display = 'flex';
    }

    function applyDenied() {
        document.title = 'Access Denied';
        favicon.href   = 'data:,';
        addBlockers(); // Locks down interactions entirely
        if (overlay) overlay.style.display = 'flex';
    }

    function applyGranted() {
        document.title = originalTitle;
        origFaviconHref ? (favicon.href = origFaviconHref) : (favicon.parentNode && favicon.parentNode.removeChild(favicon));
        removeBlockers(); // Restores input controls
        if (overlay) overlay.style.display = 'none';
    }

    function check() {
        // Updated to explicitly look for "true" as the valid override string
        var current = localStorage.getItem('Access') === 'true' ? 'Granted' : 'Denied';
        if (current === lastState) return;
        lastState = current;
        current === 'Granted' ? applyGranted() : applyDenied();
    }

    check();

    document.addEventListener('DOMContentLoaded', function () {
        buildOverlay();
        if (lastState === 'Denied' && overlay) overlay.style.display = 'flex';
        setInterval(check, 500);
    });

    window.addEventListener('storage', function(e) {
        if (e.key === 'Access') check();
    });

})();</script>
